services:
  # ===== MySQL (para servicio Java de predicción) =====
  mysql:
    image: mysql:8.4
    container_name: football-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-football_db}
    ports:
      - "3350:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # ===== Microservicio Java — predicciones con DeepSeek =====
  football-api:
    build: ./prediction-service
    container_name: football-api
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    env_file:
      - ./prediction-service/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-football_db}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # ===== Backend Node.js =====
  backend:
    build: ./backend
    container_name: wc2026-backend
    restart: always
    depends_on:
      - football-api
    ports:
      - "3000:3000"
    environment:
      JAVA_API_URL: http://football-api:8080/api
    env_file:
      - ./backend/.env

  # ===== Frontend React/Vite =====
  frontend:
    build: ./frontend
    container_name: wc2026-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql-data:
